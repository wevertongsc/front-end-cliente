<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrocaFácil</title>
  <link rel="stylesheet" href="Estilo.css">
</head>
<body>
  <header>
    <div class="logo">TrocaFácil</div>
  </header>

  <main class="container">
    <div id="loading" class="loading-overlay hidden">
      <div class="spinner"></div>
      <p>Processando...</p>
    </div>

    <section class="card" id="telaAdicionar">
      <h2>Gerenciar Frota</h2>
      <button class="btn-primary" id="btnAbrir">Adicionar Novo Veículo</button>
    </section>

    <section class="card form-hidden" id="formulario">
      <h2 id="tituloFormulario">Cadastrar Veículo</h2>
      <input type="hidden" id="veiculoId"> <div class="form-group">
        <label for="marca">Marca:</label>
        <input type="text" id="marca" placeholder="Ex: Fiat" />
      </div>

      <div class="form-group">
        <label for="modelo">Modelo:</label>
        <input type="text" id="modelo" placeholder="Ex: Uno" />
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="ano">Ano:</label>
          <input type="number" id="ano" min="1900" max="2100" placeholder="Ex: 2020" />
        </div>

        <div class="form-group">
          <label for="km">KM Atual:</label>
          <input type="number" id="km" min="0" placeholder="Ex: 50000" />
        </div>
      </div>

      <button class="btn-primary" id="btnSalvar">Salvar</button>
      <button class="btn-secondary" id="btnCancelar">Cancelar</button>
    </section>

    <section class="card">
      <h2>Veículos Cadastrados</h2>
      <div class="lista-veiculos" id="listaVeiculos"></div>
    </section>
  </main>

  <footer>
    © 2025 — Sistema de Troca de Óleo
  </footer>

  <script src="Script.js" defer></script>
</body>
</html>
